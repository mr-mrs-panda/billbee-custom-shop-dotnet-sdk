name: Deploy to NuGet

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to NuGet
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Pack
      run: |
        dotnet pack ./Panda.Billbee.CustomShopSdk/Panda.Billbee.CustomShopSdk.csproj --no-build --configuration Release --output ./artifacts -p:PackageVersion=${{ steps.version.outputs.VERSION }}
        dotnet pack ./Panda.Billbee.CustomShopSdk.AspNetCore/Panda.Billbee.CustomShopSdk.AspNetCore.csproj --no-build --configuration Release --output ./artifacts -p:PackageVersion=${{ steps.version.outputs.VERSION }}

    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
